services:
  jansen-bot:
    build: .
    image: jansen-bot:latest
    ports:
      - "8080:8080"
    environment:

      BOT_DB_URL: jdbc:postgresql://postgres-bot:5432/jansenbot
      BOT_DB_USER: jansenbot
      BOT_DB_PASSWORD: postgres




  postgres-bot:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jansenbot
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jansenbot
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispassword

  evolution-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution