# ============================================
# Jansen Bot - Configurações da aplicação
# ============================================

spring.application.name=jansen-bot
server.port=${SERVER_PORT:8080}

# --- Evolution API (WhatsApp) ---
evolution.api.base-url=${EVOLUTION_API_URL:http://evolution-api:8080}
evolution.api.key=${EVOLUTION_API_KEY:sua-chave-evolution}
evolution.api.instance=${EVOLUTION_INSTANCE_NAME:jansen-banda}

# --- Claude API ---
claude.api.key=${CLAUDE_API_KEY:sua-chave-claude}
claude.api.model=${CLAUDE_MODEL:claude-haiku-4-5-20251001}
claude.api.max-tokens=${CLAUDE_MAX_TOKENS:1024}

# --- Google Sheets ---
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_ID:seu-spreadsheet-id}
google.sheets.credentials-path=${GOOGLE_CREDENTIALS_PATH:/app/credentials/google-credentials.json}

# Abas da planilha
google.sheets.tab.members=Members
google.sheets.tab.rehearsals=Rehearsals
google.sheets.tab.setlist=Setlist
google.sheets.tab.responses=Responses
google.sheets.tab.conversation=ConversationState
google.sheets.tab.shows=Shows
google.sheets.tab.show-reminders=ShowReminders
google.sheets.tab.arrivals=Arrivals
google.sheets.tab.member-of-month-votes=MemberOfMonthVotes
google.sheets.tab.monthly-report=MonthlyReport

# --- Banda ---
banda.nome=${BANDA_NOME:Minha Banda}
banda.admin-phones=${BANDA_ADMIN_PHONES:5511999999999}

# --- Lembretes de ensaio (24h antes) ---
scheduler.reminder.cron=${REMINDER_CRON:0 0 9 * * *}
scheduler.reminder.timezone=${REMINDER_TIMEZONE:America/Sao_Paulo}

# --- Lembretes de show (3 dias e 1 dia antes) ---
scheduler.show-reminder.cron=${SHOW_REMINDER_CRON:0 0 9 * * *}
scheduler.show-reminder.timezone=${SHOW_REMINDER_TIMEZONE:America/Sao_Paulo}

# --- Relatório mensal (dia 1º às 08h) ---
scheduler.monthly-report.cron=${MONTHLY_REPORT_CRON:0 0 8 1 * *}
scheduler.monthly-report.timezone=${MONTHLY_REPORT_TIMEZONE:America/Sao_Paulo}

# --- Alerta de faltas consecutivas (diário às 22h) ---
scheduler.absence-check.cron=${ABSENCE_CHECK_CRON:0 0 22 * * *}
scheduler.absence-check.timezone=${ABSENCE_CHECK_TIMEZONE:America/Sao_Paulo}

# --- Webhook ---
webhook.enabled=${WEBHOOK_ENABLED:true}

# --- Logging ---
logging.level.com.jansen.bot=INFO
logging.level.org.springframework.web=WARN
